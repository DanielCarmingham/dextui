# The repo's first automated checks. Everything here was previously run by
# hand, from the list in CLAUDE.md's Releasing section -- this does not invent
# a stricter rule, it just stops the existing one depending on someone
# remembering.
#
# Unlike release.yml, this file is hand-written and is not generated by dist.
# Editing it is fine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR should cancel the run for the first one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux carries the lint as well, because clippy's findings are
  # platform-independent and running it twice would only ever fail twice.
  linux:
    name: test + clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  # macOS is not redundant. src/watch.rs is the app's core mechanism and its
  # backend differs per platform -- fsevent here, inotify on Linux -- and
  # CLAUDE.md records that macOS specifically drops notify events for the
  # atomic-rename writes dex uses, which is the whole reason the stat-gated
  # safety net exists. watch::inode is cfg-gated on unix too. Tests only: see
  # the clippy note above.
  macos:
    name: test (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # The floor Cargo.toml claims, checked rather than asserted. It has been
  # wrong before: it said 1.85 for four releases while ratatui 0.30.2 and
  # tui-markdown 0.3.9 both required 1.88, so `cargo install` on a 1.85
  # toolchain failed with a dependency error instead of a clear one.
  msrv:
    name: build on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
